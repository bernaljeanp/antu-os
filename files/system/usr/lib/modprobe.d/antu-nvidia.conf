# Suspensión: la memoria de la GPU se guarda en disco (/var/tmp), no en RAM; con 8 GB de VRAM la RAM temporal
# puede no alcanzar. Los servicios nvidia-suspend/resume/hibernate se activan en el Containerfile.
# Portátiles híbridos: la NVIDIA se apaga sola cuando nadie la usa (RTD3), lo que alarga la batería.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_DynamicPowerManagement=0x02
