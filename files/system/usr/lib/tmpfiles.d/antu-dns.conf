# La compilación deja /etc/resolv.conf vacío y solo para root (0700): las apps que lo leen, como los Flatpak, quedarían
# sin internet. En cada arranque se reemplaza por el enlace que recomienda systemd-resolved, legible por todos.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
