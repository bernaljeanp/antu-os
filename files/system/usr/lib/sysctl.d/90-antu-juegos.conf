# Antu: ajustes para juegos, los mismos que usan SteamOS, Bazzite o CachyOS.

# Juegos que reservan muchísimas zonas de memoria (DayZ, Star Citizen, Hogwarts Legacy y varios con Proton): el valor
# de SteamOS.
vm.max_map_count = 2147483642

# Sin la penalización por «split lock»: algunos juegos de Windows la provocan y el kernel los frenaba a propósito.
# El guion inicial lo vuelve opcional: solo existe en procesadores que detectan el split lock (no en todas las VM).
-kernel.split_lock_mitigate = 0

# Memoria comprimida (zram, ver zram-generator.conf): se usa antes que el disco y se lee de a una página, como en
# Fedora y Pop!_OS. Menos tirones cuando el juego y el navegador llenan la memoria.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
