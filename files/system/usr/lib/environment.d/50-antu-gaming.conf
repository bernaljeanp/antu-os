# Proton: NVAPI activado para DLSS y Reflex en GPUs NVIDIA (los archivos nvngx los trae nvidia-utils).
PROTON_ENABLE_NVAPI=1
# Caché de sombreadores de NVIDIA de 12 GB (por defecto son 128 MB y se llena con un par de juegos grandes):
# menos tirones la segunda vez que se juega.
__GL_SHADER_DISK_CACHE_SIZE=12000000000
