# Genera un disco VMware (.vmdk) con la imagen publicada, para probar Antu en una VM desde Windows.
name: disco-vm
on:
  workflow_dispatch:

jobs:
  disk:
    name: Disco VMware
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: bootc-dev/actions/bootc-ubuntu-setup@de95828443214c605662555316955bd1425b448d # main, 2026-10-18

      - name: Instalar en una imagen de disco
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antu-nvidia:stable"
          echo "$GITHUB_TOKEN" | sudo podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          sudo podman pull "$image"
          sudo ANTU_IMAGE="$image" bash scripts/install-to-disk.sh "$PWD/antu.img"

      - name: Convertir a VMware
        run: |
          sudo apt-get install -y qemu-utils
          qemu-img convert -O vmdk -o subformat=streamOptimized antu.img antu-nvidia.vmdk
          ls -lh antu-nvidia.vmdk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antu-nvidia-vmdk
          path: antu-nvidia.vmdk
          retention-days: 3
          compression-level: 0
