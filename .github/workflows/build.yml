name: antu
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      # Solo el USB en vivo: lo compila iso.yml sobre la imagen ya publicada.
      - Containerfile.live
      - "files/live/**"
      - scripts/make-iso.sh
      - ci/iso-test.sh
      - .github/workflows/iso.yml
  pull_request:
  schedule:
    - cron: "00 06 * * *" # diario: recoge las actualizaciones de Arch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar arranque y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Instala podman reciente, bcvk y libvirt (las mismas herramientas que usa bootcrew).
      - uses: bootc-dev/actions/bootc-ubuntu-setup@de95828443214c605662555316955bd1425b448d # main, 2026-10-18
        with:
          libvirt: "true"

      # Sin sudo: bcvk busca la imagen en el almacenamiento de podman del usuario.
      - name: Compilar imagen de prueba
        run: podman build --build-arg ANTU_CI=1 -t localhost/antu-test:latest .

      - name: Prueba de arranque en VM
        run: |
          bcvk ephemeral run-ssh localhost/antu-test:latest -- sh -c '
            set -e
            systemctl is-system-running --wait || true
            failed="$(systemctl --failed --no-legend --plain)"
            [ -z "$failed" ] || { echo "Unidades con fallo:"; echo "$failed"; exit 1; }
            systemctl is-active NetworkManager sddm
            modinfo -n nvidia
            grep -q "LookAndFeelPackage=org.antuos.desktop" /etc/xdg/kdeglobals
            # Juegos: Steam, Gamescope, GameMode y MangoHud presentes, y NVIDIA de 32 y 64 bits iguales.
            command -v steam gamescope gamemoded mangohud prime-run flatpak > /dev/null
            test -x /usr/bin/antu-eclipse
            test -f /usr/lib/systemd/system/antu-apps.service
            test -f /usr/lib/systemd/system/antu-craft-apps.service
            # Inicio: cuenta de sistema, ayudante ejecutable, regla de polkit y sin el asistente de consola anterior.
            getent passwd antu-inicio > /dev/null
            test -x /usr/lib/antu/inicio-helper && test -x /usr/lib/antu/inicio/inicio.py
            test -f /usr/share/polkit-1/rules.d/50-antu-inicio.rules
            ! systemctl is-enabled systemd-homed-firstboot > /dev/null 2>&1
            # Utilidades, USBoot, IA opcional y energía/suspensión de NVIDIA.
            command -v ark gwenview spectacle kate kcalc 7z > /dev/null
            test -x /usr/lib/usboot/AppRun && test -x /usr/bin/antu-ia
            systemctl is-enabled nvidia-suspend nvidia-resume nvidia-hibernate > /dev/null
            grep -q "NVreg_DynamicPowerManagement=0x02" /usr/lib/modprobe.d/antu-nvidia.conf
            test -f /usr/lib/nvidia/wine/nvngx_dlssg.dll
            # Sin relleno: ni LibreOffice ni Firefox en la imagen.
            ! pacman -Qq | grep -qE "^(libreoffice|firefox)"
            [ "$(pacman -Q nvidia-utils | cut -d " " -f 2)" = "$(pacman -Q lib32-nvidia-utils | cut -d " " -f 2)" ]
            # Seguridad: ninguna cuenta sin contraseña y root bloqueado (SSH de CI entra con llave).
            empty="$(awk -F: '\''$2 == "" {print $1}'\'' /etc/shadow)"
            [ -z "$empty" ] || { echo "Cuentas sin contraseña: $empty"; exit 1; }
            passwd -S root | awk '\''{exit ($2 == "L" || $2 == "LK") ? 0 : 1}'\''
            bootc --version
            echo "ANTU: prueba de arranque OK"
          '

      # Fotografía el inicio de sesión y el arranque en una pantalla virtual; falla si el tema de SDDM tiene errores.
      - name: Capturas de la interfaz
        run: |
          mkdir -p capturas
          podman run --rm -v "$PWD/capturas:/out" -v "$PWD/ci:/ci:ro" localhost/antu-test:latest bash /ci/screenshots.sh

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas
          path: capturas/
          retention-days: 7
          if-no-files-found: warn

      - name: Compilar imagen publicable (sin SSH)
        if: github.event_name != 'pull_request'
        run: podman build -t antu-nvidia:latest .

      - name: Publicar en ghcr.io
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antu-nvidia"
          echo "$GITHUB_TOKEN" | podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          for tag in latest "$(date -u +%Y%m%d)"; do
            podman push antu-nvidia:latest "$image:$tag"
          done
