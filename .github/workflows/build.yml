name: antu
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      # Solo el USB en vivo: lo compila iso.yml sobre la imagen ya publicada.
      - Containerfile.live
      - "files/live/**"
      - scripts/make-iso.sh
      - ci/iso-test.sh
      - .github/workflows/iso.yml
      # Prueba aparte de la cadena de arranque seguro.
      - ci/arranque-seguro.sh
      - .github/workflows/arranque-seguro.yml
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  schedule:
    - cron: "00 06 * * *" # diario: recoge las actualizaciones de Arch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Solo se cancelan los PR: cortar una publicación a medias dejaría una versión publicada sin firmar.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilar, probar arranque y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write  # firma sin llaves de cosign con la identidad de este workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Instala podman reciente, bcvk y libvirt (las mismas herramientas que usa bootcrew).
      - uses: bootc-dev/actions/bootc-ubuntu-setup@de95828443214c605662555316955bd1425b448d # main, 2026-10-18
        with:
          libvirt: "true"

      # Sin sudo: bcvk busca la imagen en el almacenamiento de podman del usuario.
      - name: Compilar imagen de prueba
        run: |
          : > "$RUNNER_TEMP/sin-llave"  # esta imagen no se publica: no recibe la llave de arranque
          podman build --build-arg ANTU_CI=1 --secret id=antu_arranque,src="$RUNNER_TEMP/sin-llave" -t localhost/antu-test:latest .

      - name: Modo Eclipse elige bien la gráfica
        run: bash ci/eclipse-graficas.sh

      - name: Prueba de arranque en VM
        run: |
          probar() {
          bcvk ephemeral run-ssh localhost/antu-test:latest -- sh -c '
            set -e
            systemctl is-system-running --wait || true
            failed="$(systemctl --failed --no-legend --plain)"
            [ -z "$failed" ] || { echo "Unidades con fallo:"; echo "$failed"; exit 1; }
            systemctl is-active NetworkManager sddm
            modinfo -n nvidia
            # Un solo sistema para toda gráfica: controlador de núcleo y Vulkan de 64 y 32 bits para AMD e Intel.
            modinfo -n amdgpu
            modinfo -n i915
            for g in radeon intel; do test -f /usr/share/vulkan/icd.d/${g}_icd.json; test -f /usr/lib/libvulkan_$g.so; test -f /usr/lib32/libvulkan_$g.so; done
            # Modo Eclipse: todo lo que usa existe, y esta versión de Gamescope acepta sus opciones.
            test -x /usr/lib/antu/eclipse-helper
            test -x /usr/lib/antu/aviso/aviso.py
            command -v gdbus gamemoded mangoapp logger pkexec > /dev/null
            for o in --steam --mangoapp --adaptive-sync --prefer-vk-device; do gamescope --help 2>&1 | grep -q -- "$o"; done
            test -f /usr/share/polkit-1/rules.d/50-antu-eclipse.rules
            # La Biblioteca: su acceso apunta a un programa que existe.
            test -x /usr/lib/antu/biblioteca/biblioteca.py && grep -q "Exec=/usr/lib/antu/biblioteca/biblioteca.py" /usr/share/applications/antu-biblioteca.desktop
            test -f /etc/MangoHud/MangoHud.conf
            # El Observatorio: mide solo en cada cuenta.
            test -x /usr/lib/antu/observatorio/observador.py && test -x /usr/lib/antu/observatorio/observatorio.py
            systemctl --global is-enabled antu-observatorio
            # Lo básico de un escritorio: volumen, pantallas, Bluetooth, sonido de los portátiles y wifi.
            pacman -Q plasma-pa kscreen bluez bluedevil kwallet-pam sof-firmware wireless-regdb pipewire-alsa switcheroo-control > /dev/null
            for k in kcm_pulseaudio kcm_kscreen kcm_bluetooth; do test -f /usr/lib/qt6/plugins/plasma/kcms/systemsettings/$k.so; done
            systemctl is-enabled bluetooth switcheroo-control
            # Por este aviso de su acceso, KDE abre Steam en la gráfica dedicada, con la lista que da switcheroo-control.
            grep -q "PrefersNonDefaultGPU=true" /usr/share/applications/steam.desktop
            # Cualquier programa puede leer la configuración de red y de nombres, no solo root.
            setpriv --reuid=65534 --regid=65534 --clear-groups cat /etc/resolv.conf /etc/hosts /etc/nsswitch.conf > /dev/null
            # Cursor de Antu: la biblioteca real del sistema lo lee, también por un nombre alternativo, y es el predeterminado.
            python3 -c "import ctypes as c; l = c.CDLL(\"libXcursor.so.1\"); l.XcursorLibraryLoadImage.restype = c.c_void_p; assert l.XcursorLibraryLoadImage(b\"left_ptr\", b\"Antu-Cursores\", 24)"
            grep -q "cursorTheme=Antu-Cursores" /etc/xdg/kcminputrc && grep -q "Inherits=Antu-Cursores" /usr/share/icons/default/index.theme
            # Arranque seguro: shim y su registro de llaves, con la herramienta que crea la entrada del equipo.
            test -f /usr/lib/antu/arranque/shimx64.efi && test -f /usr/lib/antu/arranque/mmx64.efi
            test -f /usr/share/antu/arranque-seguro.cer
            command -v efibootmgr > /dev/null
            # Firmas: cada equipo exige la llave de Antu para las versiones de Antu.
            grep -q sigstoreSigned /etc/containers/policy.json && test -f /etc/pki/containers/antu.pub
            python3 -c "import json; json.load(open(\"/etc/containers/policy.json\"))"
            grep -q "LookAndFeelPackage=org.antuos.desktop" /etc/xdg/kdeglobals
            # Juegos: Steam, Gamescope, GameMode y MangoHud presentes, y NVIDIA de 32 y 64 bits iguales.
            command -v steam gamescope gamemoded mangohud prime-run flatpak > /dev/null
            test -x /usr/bin/antu-eclipse
            test -f /usr/lib/systemd/system/antu-apps.service
            test -f /usr/lib/systemd/system/antu-craft-apps.service
            # Inicio: cuenta de sistema, ayudante ejecutable, regla de polkit y sin el asistente de consola anterior.
            # (Las negaciones van como if/exit o test !: un «! comando» no detiene el script con set -e.)
            getent passwd antu-inicio > /dev/null
            test -x /usr/lib/antu/inicio-helper && test -x /usr/lib/antu/inicio/inicio.py
            test -f /usr/share/polkit-1/rules.d/50-antu-inicio.rules
            if systemctl is-enabled systemd-homed-firstboot > /dev/null 2>&1; then echo "Asistente de consola activo"; exit 1; fi
            # Utilidades, USBoot, IA opcional y energía/suspensión de NVIDIA.
            command -v ark gwenview spectacle kate kcalc 7z > /dev/null
            test -x /usr/lib/usboot/AppRun && test -x /usr/bin/antu-ia
            systemctl is-enabled nvidia-suspend nvidia-resume nvidia-hibernate > /dev/null
            grep -q "NVreg_DynamicPowerManagement=0x02" /usr/lib/modprobe.d/antu-nvidia.conf
            test -f /usr/lib/nvidia/wine/nvngx_dlssg.dll
            # Arte: el fondo que cargan el inicio de sesión, Inicio y el instalador, el ícono del menú y el arranque animado.
            test -f /usr/share/wallpapers/Paranal/contents/images_dark/3840x2160.jpg
            test -f /usr/share/icons/hicolor/256x256/apps/antu.png
            test -f /usr/share/plymouth/themes/antu/simbolo.png
            test -f /usr/share/icons/Antu/index.theme && test -f /usr/share/icons/Antu/32x32/places/folder.png
            # Zenit: su lógica pasa la autoprueba y el servicio corre aunque la VM no sea un Alienware.
            python3 /usr/lib/antu/zenit/zenit.py autoprueba
            systemctl is-active zenit
            # Actualizaciones automáticas: el temporizador está activo y el script existe.
            systemctl is-enabled antu-actualizar.timer
            test -x /usr/lib/antu/actualizar
            # La app de actualizaciones: su ayudante responde con un estado legible y tiene su regla de permisos.
            /usr/lib/antu/actualizar-helper estado | python3 -c "import json, sys; json.load(sys.stdin)"
            test -f /usr/share/polkit-1/rules.d/50-antu-actualizar.rules
            # La llave pública con la que se comprobará cada actualización.
            grep -q "BEGIN PUBLIC KEY" /etc/pki/containers/antu.pub
            # Seguridad del sistema: firewall activo en la zona antu y el kernel endurecido.
            systemctl is-active firewalld
            [ "$(firewall-cmd --get-default-zone)" = antu ]
            [ "$(sysctl -n kernel.dmesg_restrict)" = 1 ] && [ "$(sysctl -n kernel.yama.ptrace_scope)" = 1 ]
            # Juegos: memoria para títulos exigentes, sin penalización por split lock, NTSYNC y memoria comprimida.
            [ "$(sysctl -n vm.max_map_count)" = 2147483642 ]
            [ ! -e /proc/sys/kernel/split_lock_mitigate ] || [ "$(sysctl -n kernel.split_lock_mitigate)" = 0 ]
            test -e /dev/ntsync
            swapon --show=NAME --noheadings | grep -q zram
            # Programar: Git y las cajas de desarrollo (Podman y Distrobox), y el armado del entorno de Inicio.
            command -v git podman distrobox > /dev/null && test -x /usr/lib/antu/programar
            # Nada del sistema en vivo en la imagen instalada, ni archivos con permisos especiales en USBoot.
            test ! -e /usr/share/polkit-1/rules.d/49-antu-live.rules
            if getent passwd antu > /dev/null; then echo "La cuenta del sistema en vivo está en la imagen"; exit 1; fi
            [ -z "$(find /usr/lib/usboot \( -perm /6000 -o ! -uid 0 \) -print -quit)" ]
            # Sin relleno: ni LibreOffice ni Firefox en la imagen.
            if pacman -Qq | grep -qE "^(libreoffice|firefox)"; then echo "LibreOffice o Firefox en la imagen"; exit 1; fi
            [ "$(pacman -Q nvidia-utils | cut -d " " -f 2)" = "$(pacman -Q lib32-nvidia-utils | cut -d " " -f 2)" ]
            # Seguridad: ninguna cuenta sin contraseña y root bloqueado (SSH de CI entra con llave).
            empty="$(awk -F: '\''$2 == "" {print $1}'\'' /etc/shadow)"
            [ -z "$empty" ] || { echo "Cuentas sin contraseña: $empty"; exit 1; }
            passwd -S root | awk '\''{exit ($2 == "L" || $2 == "LK") ? 0 : 1}'\''
            bootc --version
            echo "ANTU: prueba de arranque OK"
          '
          }
          # El 255 es de ssh, no de una comprobación: a veces la VM no contesta a tiempo. Un fallo de verdad se repite.
          for intento in 1 2 3; do
            codigo=0
            probar || codigo=$?
            [ "$codigo" = 255 ] || break
            echo "::warning::La VM no contestó por ssh (intento $intento de 3)"
          done
          exit "$codigo"

      # Fotografía el inicio de sesión y el arranque en una pantalla virtual; falla si el tema de SDDM tiene errores.
      - name: Capturas de la interfaz
        run: |
          mkdir -p capturas
          podman run --rm -v "$PWD/capturas:/out" -v "$PWD/ci:/ci:ro" localhost/antu-test:latest bash /ci/screenshots.sh

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas
          path: capturas/
          retention-days: 7
          if-no-files-found: warn

      - name: Compilar imagen publicable (sin SSH)
        if: github.event_name != 'pull_request'
        env:
          ANTU_ARRANQUE_PEM: ${{ secrets.ANTU_ARRANQUE_PEM }}
        run: |
          umask 077
          printf '%s' "$ANTU_ARRANQUE_PEM" > "$RUNNER_TEMP/arranque.pem"
          podman build --secret id=antu_arranque,src="$RUNNER_TEMP/arranque.pem" -t localhost/antu-nvidia:sin-reempaquetar .
          rm -f "$RUNNER_TEMP/arranque.pem"
          # Nunca se publica una versión sin firmar: con el arranque seguro activo, no arrancaría en ningún equipo.
          sudo apt-get install -y -qq sbsigntool > /dev/null
          imagen() { podman run --rm localhost/antu-nvidia:sin-reempaquetar sh -c "cat $1"; }
          imagen /usr/share/antu/arranque-seguro.cer | openssl x509 -inform DER -out "$RUNNER_TEMP/arranque.crt"
          imagen "/usr/lib/modules/*/vmlinuz" > "$RUNNER_TEMP/vmlinuz"
          imagen /usr/lib/systemd/boot/efi/systemd-bootx64.efi.signed > "$RUNNER_TEMP/cargador.efi"
          sbverify --cert "$RUNNER_TEMP/arranque.crt" "$RUNNER_TEMP/vmlinuz"
          sbverify --cert "$RUNNER_TEMP/arranque.crt" "$RUNNER_TEMP/cargador.efi"
          rm -f "$RUNNER_TEMP/vmlinuz" "$RUNNER_TEMP/cargador.efi"

      # Reempaqueta por paquetes con chunkah: cada paquete de Arch en su capa (por el atributo user.component que pone
      # files/scripts/componentes.py), así una actualización solo baja los paquetes que cambiaron.
      - name: Reempaquetar por paquetes
        if: github.event_name != 'pull_request'
        run: |
          podman run --rm localhost/antu-nvidia:sin-reempaquetar python3 -c \
            'import os; print("bash pertenece a:", os.getxattr("/usr/bin/bash", "user.component").decode())' \
            || echo "::warning::Los archivos no traen su paquete: el reempaquetado no podrá agrupar por paquete"
          export CHUNKAH_CONFIG_STR="$(podman inspect localhost/antu-nvidia:sin-reempaquetar)"
          podman run --rm --mount=type=image,src=localhost/antu-nvidia:sin-reempaquetar,target=/chunkah -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523 \
            build --max-layers 128 -t localhost/antu-nvidia:latest | podman load
          bootc="$(podman image inspect localhost/antu-nvidia:latest --format '{{ index .Labels "containers.bootc" }}')"
          capas="$(podman image inspect localhost/antu-nvidia:latest --format '{{ len .RootFS.Layers }}')"
          echo "Imagen reempaquetada: $capas capas"
          [ "$bootc" = 1 ] || { echo "::error::La imagen reempaquetada perdió la etiqueta containers.bootc"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      # Canal de prueba: cada versión que pasa la prueba en VM. Pasa al canal estable (el de los equipos instalados)
      # solo después de la prueba completa de iso.yml. Cada versión va firmada con la identidad de este workflow.
      - name: Publicar en el canal de prueba y firmar
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTU_FIRMA_PEM: ${{ secrets.ANTU_FIRMA_PEM }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antu-nvidia"
          echo "$GITHUB_TOKEN" | podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          # Firma con la llave de Antu en el formato que comprueba containers/image en cada equipo (adjuntos sigstore;
          # la llave pública va en /etc/pki/containers/antu.pub). La privada solo vive en el secreto ANTU_FIRMA_PEM.
          mkdir -p ~/.config/containers/registries.d
          printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "$image" > ~/.config/containers/registries.d/antu.yaml
          export COSIGN_PASSWORD="$(openssl rand -hex 24)"
          umask 077
          printf '%s\n' "$ANTU_FIRMA_PEM" > "$RUNNER_TEMP/antu.pem"
          cosign import-key-pair --key "$RUNNER_TEMP/antu.pem" --output-key-prefix "$RUNNER_TEMP/antu" > /dev/null
          printf '%s' "$COSIGN_PASSWORD" > "$RUNNER_TEMP/clave"
          podman push --digestfile digest --sign-by-sigstore-private-key "$RUNNER_TEMP/antu.key" \
            --sign-passphrase-file "$RUNNER_TEMP/clave" localhost/antu-nvidia:latest "$image:testing"
          rm -f "$RUNNER_TEMP/antu.pem" "$RUNNER_TEMP/antu.key" "$RUNNER_TEMP/clave"
          podman push localhost/antu-nvidia:latest "$image:testing-$(date -u +%Y%m%d)"
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$image@$(cat digest)"
          echo "Publicada y firmada: $image@$(cat digest)"
