# Crea el USB en vivo de Antu (ISO con el instalador gráfico) y lo prueba en QEMU: arranque en vivo, instalación en un
# disco virtual y arranque del sistema instalado. Corre después de cada compilación publicada de la imagen y cuando
# cambia solo el sistema en vivo.
name: iso
on:
  workflow_run:
    workflows: [antu]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - Containerfile.live
      - "files/live/**"
      - scripts/make-iso.sh
      - ci/iso-test.sh
      - .github/workflows/iso.yml
  workflow_dispatch:
    inputs:
      aprobar:
        description: "Aprobar la rama nueva de NVIDIA o el núcleo nuevo (ya probados en un equipo real)"
        type: boolean
        default: false

# Una prueba en curso nunca se corta: la siguiente espera su turno.
concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  iso:
    name: Crear y probar la ISO
    # Tras una compilación de la imagen, solo si salió bien; por push o a mano, siempre.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write  # para promover al canal estable la versión que pasó la prueba
      issues: write  # para avisar cuando una versión espera aprobación
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune --all --force > /dev/null
          df -h /

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo squashfs-tools xorriso mtools dosfstools \
            qemu-system-x86 qemu-utils ovmf socat imagemagick > /dev/null

      - name: Crear la ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          sudo bash scripts/make-iso.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antu-nvidia:testing"
          df -h /

      # El instalador en modo demo dentro del sistema en vivo; falla si su interfaz tiene errores de QML.
      - name: Capturas de la interfaz en vivo
        run: |
          mkdir -p capturas
          sudo podman run --rm -v "$PWD/capturas:/out" -v "$PWD/ci:/ci:ro" localhost/antu-live bash /ci/screenshots.sh

      - name: Probar en QEMU
        run: sudo bash ci/iso-test.sh iso-build

      # La versión que pasó la prueba completa (USB, instalación y arranque del disco) pasa al canal estable, el que
      # siguen los equipos instalados. Mismo contenido y misma firma: solo cambia la etiqueta.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Promover al canal estable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APROBAR: ${{ inputs.aprobar }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antu-nvidia"
          digest="$(cat iso-build/digest)"
          # Solo sube a estable una versión firmada por la compilación de este repositorio.
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify "$image@$digest" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" > /dev/null
          # La firma con la llave de Antu (la que comprobarán los equipos) ya se comprobó en make-iso.sh.

          # Freno: la VM no tiene gráfica real. Las correcciones pasan solas, pero una rama nueva de NVIDIA o una versión nueva
          # del núcleo esperan a que alguien las apruebe tras probarlas en un equipo. Lo aprobado queda como etiqueta.
          versiones="$(sudo podman run --rm localhost/antu-live pacman -Q nvidia-utils linux)"
          rama="$(awk '$1 == "nvidia-utils" {split($2, v, "."); print v[1]}' <<< "$versiones")"
          nucleo="$(awk '$1 == "linux" {split($2, v, "."); print v[1] "." v[2]}' <<< "$versiones")"
          [ -n "$rama" ] && [ -n "$nucleo" ]
          marca="aprobada-nvidia-$rama-nucleo-$nucleo"
          etiquetas="$(sudo skopeo list-tags "docker://$image")"
          if ! grep -q "\"$marca\"" <<< "$etiquetas"; then
            if grep -q '"aprobada-' <<< "$etiquetas" && [ "$APROBAR" != true ]; then
              titulo="Probar en un equipo real: NVIDIA $rama con núcleo $nucleo"
              usb="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              if [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number --jq length)" = 0 ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "Esta versión pasó todas las pruebas en máquinas virtuales, pero esas pruebas no tienen gráfica real, así que no llegará sola a los equipos.

          1. Baja el USB de [esta prueba]($usb) y arráncalo en un equipo con NVIDIA.
          2. Comprueba que el escritorio y un juego funcionan.
          3. Si está bien, apruébala: en Actions, abre **iso**, elige **Run workflow** y marca la casilla de aprobar."
              fi
              echo "::notice::$titulo: espera aprobación, no pasa al canal estable"
              exit 0
            fi
            sudo skopeo copy --all --preserve-digests --quiet "docker://$image@$digest" "docker://$image:$marca"
          fi

          for tag in stable latest "$(date -u +%Y%m%d)"; do
            sudo skopeo copy --all --preserve-digests --quiet "docker://$image@$digest" "docker://$image:$tag"
          done
          echo "Canal estable: $image@$digest"

      - name: Subir capturas y registros
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-iso
          path: |
            capturas/
            pruebas-iso/*.png
            pruebas-iso/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Subir ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antu-live-iso
          path: |
            iso-build/antu-live.iso
            iso-build/antu-live.iso.sha256
          retention-days: 7
          compression-level: 0
